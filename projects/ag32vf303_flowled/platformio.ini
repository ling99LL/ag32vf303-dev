# AG32VF303KCU6 (QFN32) flowing LED project
# Board: AGM official AG32VF303 NANO board, AGM official DAPLink (CMSIS-DAP v2)
# Docs: see ../../docs/HANDOVER.md

[platformio]
default_envs = flow
src_dir = .
include_dir = ./src

[setup]
# Board definition. agrv2k_303 covers the AG32VF303 series (QFN32 uses logic device AGRV2KQ32).
board = agrv2k_303
framework = agrv_sdk
program = led_flow
build_src_filter = "-<*> +<./src/flow_main.c>"

[setup_logic]
# Pin map file (relative to this project directory)
logic_ve = nano_board.ve
# Dev board is the 100-pin AGM demo board -> default logic device AGRV2KL100
# (LEDs on die pads PIN_31..34 per official examples). For a QFN32 KCU6 target
# board use logic_device = AGRV2KQ32 instead.
logic_compress = true

[setup_upload]
# AGM DAPLink = CMSIS-DAP v2 probe driven by OpenOCD (SWD transport)
protocol = cmsis-dap-openocd
debug_tool = ${this.protocol}
upload_protocol = ${this.protocol}

[setup_monitor]
# printf goes to UART0, which is wired to the DAPLink CDC serial port
logger_if = UART0
monitor_port = COM26
monitor_speed = 115200

[env]
platform = AgRV
extends =
  setup
  setup_logic
  setup_upload
  setup_monitor

[env:debug]
extends = env
build_type = debug
build_src_filter = "-<*> +<./src/flow_main.c>"

[env:release]
extends = env
build_type = release

# Final flowing-LED firmware. LED_PINS in src/flow_main.c must match the pads
# reported by the scan environment.
[env:flow]
extends = env
build_src_filter = "-<*> +<./src/flow_main.c>"
program = led_flow

# Pure-CPLD flowing LED: the pattern is generated in user Verilog
# (logic/analog_ip.v), the MCU app below is only a minimal host.
[env:cpldled]
extends = env
logic_ve = cpld_board.ve
ip_name = analog_ip
logic_dir = logic
build_src_filter = "-<*> +<./src/min_main.c>"
program = cpld_flow
