# AG32VF303KCU6 (QFN32) FOC force-feedback knob project
# Board: self-made QFN32 board, AGM official DAPLink (CMSIS-DAP v2)
# Reference: CSDN "基于FOC的项目----力反馈旋钮" + github.com/qihemu/FOC_Knob

[platformio]
default_envs = foc
src_dir = .
include_dir = ./src

[setup]
board = agrv2k_303
framework = agrv_sdk
program = foc_knob
build_src_filter = "-<*> +<./src/*.c>"

[setup_logic]
# Pin map file (relative to this project directory)
logic_ve = foc_knob.ve
# QFN32 KCU6 package -> logic device AGRV2KQ32 (mandatory, do not remove)
logic_device = AGRV2KQ32
logic_compress = true

[setup_upload]
# AGM DAPLink = CMSIS-DAP v2 probe driven by OpenOCD (SWD transport)
protocol = cmsis-dap-openocd
debug_tool = ${this.protocol}
upload_protocol = ${this.protocol}

[setup_monitor]
# printf goes to UART0 (die pads PIN_20=TX / PIN_21=RX on QFN32)
logger_if = UART0
monitor_port = COM26
monitor_speed = 115200

[env]
platform = AgRV
extends =
  setup
  setup_logic
  setup_upload
  setup_monitor

# FOC knob firmware (release)
[env:foc]
extends = env
build_type = release
