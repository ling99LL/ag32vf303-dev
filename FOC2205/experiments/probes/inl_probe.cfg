# Probe the two DRV8316 control pads that live on GPIO2 (loaded AFTER agrv2k.cfg).
#
#   GPIO2_BASE = 0x40016000
#   GpioDATA[] is a ONE-HOT bit-band: bit n sits at GpioDATA[1<<n]*4
#     bit0 -> +0x004   bit1 -> +0x008   bit2 -> +0x010
#   GpioDIR   = +0x400  (1 = output)
#   GpioAFSEL = +0x420  (0 = software GPIO, 1 = peripheral AF)
#
#   GPIO2_1 -> PIN_5  = nSLEEP   expect DIR.bit1=1 AFSEL.bit1=0 DATA=0xff
#   GPIO2_2 -> PIN_28 = INL_ALL  expect DIR.bit2=1 AFSEL.bit2=0 DATA=0xff
#
# NOTE: with GPIO2's APB clock gated, JTAG reads return 0x00 (bus artifact, not
# the real register content). APB_MASK_GPIO2 = 1<<6 in SYS->APB_CLKENABLE
# (0x03000060); this script ORs it in before reading.

halt

mem2array K 32 0x03000060 1
puts "APB_CLKEN_BEFORE=0x[format %08x $K(0)]   (GPIO2 = bit6 = 0x40)"
mww 0x03000060 [expr {$K(0) | 0x40}]

mem2array W 32 0x03000014 1
puts "SYS_SWJ_CNTL=0x[format %08x $W(0)]   NJTRST_DISABLED=[expr {($W(0) >> 4) & 1}] (0 = pad still owned by JTAG!)"

mem2array D 32 0x40016400 1
puts "GPIO2_DIR=0x[format %08x $D(0)]   nSLEEP_DIR=[expr {($D(0) >> 1) & 1}] INL_DIR=[expr {($D(0) >> 2) & 1}]"

mem2array F 32 0x40016420 1
puts "GPIO2_AFSEL=0x[format %08x $F(0)]   nSLEEP_AF=[expr {($F(0) >> 1) & 1}] INL_AF=[expr {($F(0) >> 2) & 1}]"

mem2array S 32 0x40016008 1
puts "nSLEEP_PIN5_DATA=0x[format %08x $S(0)]"

mem2array I 32 0x40016010 1
puts "INL_PIN28_DATA=0x[format %08x $I(0)]"

# Safety: force INL_ALL low before poking around. If the firmware is spinning in
# its HALT loop the GPIO keeps its last state, and INL high + a stopped PWM timer
# can cross-conduct a phase in 3x mode.
mww 0x40016010 0x00
mem2array I2 32 0x40016010 1
puts "INL_PIN28_AFTER_FORCE_LOW=0x[format %08x $I2(0)]"

resume
shutdown
