# FOC2205 — AG32VF303KCU6 (QFN32) + MT6701QT-STD + DRV8316C FOC driver board
# Independent project. Does NOT reference foc\foc_knob.
# Board: self-made QFN32 board, AGM official DAPLink (CMSIS-DAP v2)

[platformio]
default_envs = foc2205
src_dir = .
include_dir = ./src

[setup]
board = agrv2k_303
framework = agrv_sdk
program = foc2205
build_src_filter = "-<*> +<./src/*.c>"

[setup_logic]
# Pin map file (relative to this project directory)
logic_ve = foc2205.ve
# QFN32 KCU6 package -> logic device AGRV2KQ32 (mandatory, do not remove)
logic_device = AGRV2KQ32
logic_compress = true
# User logic: analog IP (ADC x3) + SPI mode-1 bridges live in logic_dir
ip_name = analog_ip
logic_dir = logic

[setup_upload]
# AGM DAPLink = CMSIS-DAP v2 probe driven by OpenOCD (SWD transport)
protocol = cmsis-dap-openocd
debug_tool = ${this.protocol}
upload_protocol = ${this.protocol}

[setup_monitor]
# printf goes to UART0 (die pads PIN_20=TX / PIN_21=RX on QFN32)
logger_if = UART0
monitor_port = COM26
monitor_speed = 115200

[env]
platform = AgRV
extends =
  setup
  setup_logic
  setup_upload
  setup_monitor

# FOC2205 firmware (release)
[env:foc2205]
build_type = release
